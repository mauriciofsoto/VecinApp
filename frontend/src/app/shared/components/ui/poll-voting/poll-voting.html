<div class="poll-wrapper">
  @if (question()) {
    <p class="poll-question">{{ question() }}</p>
  }

  <div class="poll-options-list" role="radiogroup" [attr.aria-label]="question() || 'Opciones de votación'">
    @for (option of options(); track option.id) {
      <button
        type="button"
        class="poll-option-item"
        [class.selected]="selectedOptionId() === option.id"
        [disabled]="disabled()"
        role="radio"
        [attr.aria-checked]="selectedOptionId() === option.id"
        (click)="selectOption(option.id)"
      >
        <span class="poll-content">
          <span class="poll-text">{{ option.text }}</span>
          <span class="poll-radio" aria-hidden="true">
            {{ selectedOptionId() === option.id ? '●' : '○' }}
          </span>
        </span>
      </button>
    }
  </div>

  <div class="poll-actions">
    <app-button
      variant="primary"
      size="sm"
      [disabled]="!selectedOptionId() || disabled()"
      (buttonClick)="confirmVote()"
    >
      Votar
    </app-button>
  </div>
</div>
