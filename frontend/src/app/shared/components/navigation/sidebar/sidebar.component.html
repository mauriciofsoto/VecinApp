
<button
  class="mobile-toggle-btn"
  type="button"
  (click)="toggleSidebar()"
  [attr.aria-expanded]="isOpen()"
  [attr.aria-label]="isOpen() ? 'Cerrar menú' : 'Abrir menú'"
>
  <span aria-hidden="true">{{ isOpen() ? '×' : '☰' }}</span>
</button>

@if (isOpen()) {
  <button
    class="sidebar-backdrop"
    type="button"
    (click)="closeSidebar()"
    aria-label="Cerrar menú"
  ></button>
}

<aside
  class="app-sidebar"
  [class.is-open]="isOpen()"
  aria-label="Navegación principal"
>
  <!-- BRAND -->
  <a class="sidebar-brand" [routerLink]="dashboardRoute()">
    <span class="brand-icon">V</span>
    <span class="brand-name">VecinApp</span>
  </a>

  <!-- CERRAR SIDEBAR MOBILE -->
  <button
    class="sidebar-close"
    type="button"
    (click)="closeSidebar()"
    aria-label="Cerrar menú"
  >
    <span aria-hidden="true">×</span>
  </button>

  <!-- PERFIL -->
  <div class="sidebar-user">
    <div class="user-avatar">
      {{ userDisplayName().charAt(0).toUpperCase() }}
    </div>

    <div class="user-info">
      <span class="user-name">{{ userDisplayName() }}</span>
      <span class="user-role">{{ userRoleLabel() }}</span>
    </div>
  </div>

  <!-- NAVEGACIÓN -->
  <nav class="sidebar-nav">
    @for (section of menuSections(); track section.title) {
      <div class="nav-section">
        <span class="nav-section-title">
          {{ section.title }}
        </span>

        @for (item of section.items; track item.route) {
          <a
            class="nav-item"
            [routerLink]="item.route"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{
              exact: item.exact ?? false
            }"
            [title]="item.label"
            (click)="closeSidebar()"
          >
            <span class="nav-icon" aria-hidden="true">
              {{ item.icon }}
            </span>

            <span class="nav-label">
              {{ item.label }}
            </span>
          </a>
        }
      </div>
    }
  </nav>

  <!-- FOOTER -->
  <div class="sidebar-footer">
    <button
      class="logout-button"
      type="button"
      (click)="logout()"
      [disabled]="loggingOut()"
      aria-label="Cerrar sesión"
    >
      <span class="logout-icon" aria-hidden="true">↪</span>

      <span class="logout-label">
        {{ loggingOut() ? 'Cerrando sesión...' : 'Cerrar sesión' }}
      </span>
    </button>
  </div>
</aside>
