
<!-- BOTÓN MENÚ MOBILE -->
<button
  class="mobile-toggle-btn"
  type="button"
  (click)="toggleSidebar()"
  [attr.aria-expanded]="isOpen()"
  [attr.aria-label]="isOpen() ? 'Cerrar menú' : 'Abrir menú'"
>
  <span aria-hidden="true">{{ isOpen() ? '×' : '☰' }}</span>
</button>

<!-- FONDO PARA CERRAR EL MENÚ MOBILE -->
@if (isOpen()) {
  <button
    class="sidebar-backdrop"
    type="button"
    (click)="closeSidebar()"
    aria-label="Cerrar menú"
  ></button>
}

<aside
  class="app-sidebar"
  [class.is-open]="isOpen()"
  aria-label="Navegación principal"
>

  <!-- BRAND -->
  <a
  class="sidebar-brand"
  [routerLink]="dashboardRoute()"
  aria-label="VecinApp - Inicio"
>
  <span class="brand-icon">
    <img src="/assets/faviconV.ico" alt="" />
  </span>

  <span class="brand-name">
    Vecin<span class="brand-name__accent">App</span>
  </span>
</a>

  <!-- CERRAR SIDEBAR MOBILE -->
  <button
    class="sidebar-close"
    type="button"
    (click)="closeSidebar()"
    aria-label="Cerrar menú"
  >
    <span aria-hidden="true">×</span>
  </button>

  <!-- NAVEGACIÓN -->
  <nav class="sidebar-nav" aria-label="Secciones">

    @for (section of menuSections(); track section.title) {
      <div class="nav-section">

        <span class="nav-section-title">
          {{ section.title }}
        </span>

        @for (item of section.items; track item.route) {
          <a
            class="nav-item"
            [routerLink]="item.route"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{
              exact: item.exact ?? false
            }"
            [title]="item.label"
            (click)="closeSidebar()"
          >

            <span class="nav-icon-wrapper" aria-hidden="true">
              <span class="nav-icon">
                {{ item.icon }}
              </span>
            </span>

            <span class="nav-label">
              {{ item.label }}
            </span>

          </a>
        }

      </div>
    }

  </nav>

  <!-- TARJETA PROMOCIONAL DEL EDIFICIO -->
  <div class="sidebar-building-card">
  <img
    class="sidebar-building-card__image"
    src="/assets/Edificiofeed.png"
    alt="Tu edificio, más conectado"
  />
</div>

  <!-- FOOTER -->
  <div class="sidebar-footer">

    <!-- CAMBIAR TEMA -->
    <button
      class="theme-toggle-button"
      type="button"
      (click)="themeService.toggle()"
      [attr.aria-label]="themeService.toggleLabel()"
      [attr.aria-pressed]="themeService.isLight()"
    >
      <span aria-hidden="true">
        {{ themeService.isLight() ? '☀' : '☾' }}
      </span>

      <span>
        {{ themeService.isLight() ? 'Tema claro' : 'Tema oscuro' }}
      </span>
    </button>

    <!-- CERRAR SESIÓN -->
    <button
      class="logout-button"
      type="button"
      (click)="logout()"
      [disabled]="loggingOut()"
      aria-label="Cerrar sesión"
    >
      <span class="logout-icon" aria-hidden="true">↪</span>

      <span class="logout-label">
        {{ loggingOut() ? 'Cerrando sesión...' : 'Cerrar sesión' }}
      </span>
    </button>

  </div>

</aside>
