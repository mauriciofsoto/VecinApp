
<header class="app-navbar">
  <div class="navbar-left">
    <div class="navbar-heading">
      <h2 class="navbar-title">{{ pageTitle() }}</h2>
    </div>
  </div>

  <div class="navbar-actions">
    <div class="navbar-notifications">
      <app-notification-bell />
    </div>

    <span class="navbar-divider" aria-hidden="true"></span>

    <a
      routerLink="/perfil"
      class="navbar-profile"
      aria-label="Abrir perfil de usuario"
    >
      <span class="navbar-profile__avatar" aria-hidden="true">
        {{ userInitials() }}
      </span>

      <span class="navbar-profile__info">
        <span class="navbar-profile__name">{{ userDisplayName() }}</span>
        <span class="navbar-profile__role">{{ userRoleLabel() }}</span>
      </span>

      <span class="navbar-profile__arrow" aria-hidden="true">⌄</span>
    </a>
  </div>
</header>
