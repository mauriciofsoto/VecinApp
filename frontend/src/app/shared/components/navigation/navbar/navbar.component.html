<header class="app-navbar">
  <!-- Izquierda: Título de la sección o contexto -->
  <div class="navbar-left">
    <h2 class="navbar-title text-heading">Dashboard</h2>
  </div>

  <!-- Centro / Derecha: Barra de búsqueda rápida y acciones -->
  <div class="navbar-actions">
    <!-- Buscador rápido -->
    <div class="search-wrapper">
      <span class="search-icon">🔍</span>
      <input 
        type="text" 
        placeholder="Buscar incidencias, vecinos..." 
        class="search-input text-body" 
      />
    </div>

    <!-- Notificaciones -->
    <button class="icon-btn" aria-label="Notificaciones">
      <span>🔔</span>
      <span class="badge-dot"></span>
    </button>

    <!-- Perfil / Acceso Rápido -->
    <div class="navbar-profile">
      <img src="assets/avatar-placeholder.png" alt="Zoe Vivas" class="avatar-sm" />
    </div>
  </div>
</header>
