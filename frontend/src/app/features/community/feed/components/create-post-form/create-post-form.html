<form class="create-post-form" (ngSubmit)="submitPost()">

  <textarea
    id="post-content"
    name="content"
    [ngModel]="content()"
    (ngModelChange)="content.set($event)"
    [placeholder]="role() === 'admin'
      ? 'Escribí un aviso para la comunidad'
      : '¿Qué querés compartir con la comunidad?'"
    rows="4"
    required
  ></textarea>

  <button type="submit" [disabled]="!content().trim()">
    {{ role() === 'admin' ? 'Publicar aviso' : 'Publicar' }}
  </button>
</form>
