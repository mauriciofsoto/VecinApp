<section class="feed">
  <header class="feed__header">
    <div>
      <h2>Comunidad</h2>
      <p>Enterate de las novedades de tu edificio.</p>
    </div>
  </header>

  <div class="feed__layout">
    <!-- FEED PRINCIPAL -->
    <main class="feed__main" aria-label="Publicaciones de la comunidad">

      <!-- BOTÓN PARA CREAR PUBLICACIONES -->
      <app-card
        variant="glass"
        size="full"
        customClass="feed__create-card"
      >
        <app-button
          variant="ghost"
          size="lg"
          [fullWidth]="true"
          customClass="feed__create-trigger-btn"
          (buttonClick)="openCreatePost()"
        >
          <span class="feed__create-avatar" aria-hidden="true">
            {{ userRole === 'admin' ? 'A' : 'U' }}
          </span>

          <span class="feed__create-placeholder">
            ¿Qué querés compartir hoy?
          </span>
        </app-button>
      </app-card>

      <!-- PUBLICACIONES -->
      <div class="feed__scroll-container">
        <div class="feed__timeline">
          @for (post of postsVisibles(); track post.id) {
            <div class="feed__item">
              <span
                class="feed__timeline-dot"
                aria-hidden="true"
              ></span>

              <app-post-card
                [post]="post"
                (postChange)="updatePost($event)"
                (commentAdded)="addComment($event)"
              />
            </div>
          } @empty {
            <app-empty-state
              title="Todavía no hay publicaciones"
              description="Sé el primero en compartir algo con la comunidad o volvé más tarde."
            />
          }
        </div>
      </div>
    </main>

    <!-- BARRA LATERAL -->
    <aside
      class="feed__sidebar"
      aria-label="Información de la comunidad"
    >
      <!-- AVISOS -->
      <app-card
        variant="glass"
        size="full"
        align="left"
      >
        <app-expandable-publication-list
          [posts]="avisosOficiales()"
          emptyMessage="No hay avisos oficiales publicados."
          (postChange)="updatePost($event)"
          (commentAdded)="addComment($event)"
        />
      </app-card>

      <!-- ENCUESTAS -->
      <app-card
        variant="glass"
        size="full"
        align="left"
      >
        <app-expandable-publication-list
          [posts]="encuestasParaLista()"
          emptyMessage="Todavía no hay encuestas publicadas."
          (postChange)="updatePost($event)"
          (commentAdded)="addComment($event)"
        />
      </app-card>
    </aside>
  </div>

  <!-- MODAL DE CREACIÓN -->
  <app-modal
    [open]="isCreatePostOpen()"
    (openChange)="closeCreatePost()"
    heading="Crear publicación"
    size="lg"
  >
    @if (userRole === 'admin') {
      <!-- ADMINISTRACIÓN: AVISOS Y ENCUESTAS -->
      <app-formulario-publicacion
        (publicada)="closeCreatePost()"
      />
    } @else {
      <!-- USUARIO: PUBLICACIÓN NORMAL -->
      <app-create-post-form
        [role]="userRole"
        (postCreated)="createPost($event)"
      />
    }
  </app-modal>

  <!-- MODAL DE HISTORIAL DE ENCUESTAS -->
  <app-modal
    [open]="isPollsOpen()"
    (openChange)="closePolls()"
    heading="Historial de Encuestas"
    size="lg"
  >
    <app-historial-encuestas
  (solicitarCrear)="openCreatePost()"/>
  </app-modal>



</section>
