
<section class="feed">
  @if (interactionError()) {
    <p role="alert" class="feed__interaction-error">
      {{ interactionError() }}
    </p>
  }

  <header class="feed__header">
    <div>
      <p>Enterate de las novedades de tu edificio.</p>
    </div>
  </header>

  <div class="feed__layout">
    <main class="feed__main" aria-label="Publicaciones de la comunidad">

      <!-- BOTÓN PARA CREAR PUBLICACIONES -->
      <app-card
        variant="glass"
        size="full"
        customClass="feed__create-card"
      >
        <app-button
          variant="ghost"
          size="lg"
          [fullWidth]="true"
          customClass="feed__create-trigger-btn"
          (buttonClick)="openCreatePost()"
        >
          <span class="feed__create-avatar" aria-hidden="true">
            {{ userRole() === 'admin' ? 'A' : 'U' }}
          </span>

          <span class="feed__create-placeholder">
            ¿Qué querés compartir hoy?
          </span>
        </app-button>
      </app-card>

      <!-- PESTAÑAS DEL FEED -->
      <nav class="feed__tabs" role="tablist" aria-label="Secciones de publicaciones">
        <button
          type="button"
          role="tab"
          id="tab-inicio"
          aria-controls="panel-publicaciones"
          [attr.aria-selected]="activeTab() === 'inicio'"
          [class.feed__tab--active]="activeTab() === 'inicio'"
          class="feed__tab"
          (click)="setActiveTab('inicio')"
        >
          <span class="feed__tab-icon" aria-hidden="true">⌂</span>
          Inicio
        </button>

        <button
          type="button"
          role="tab"
          id="tab-avisos"
          aria-controls="panel-publicaciones"
          [attr.aria-selected]="activeTab() === 'avisos'"
          [class.feed__tab--active]="activeTab() === 'avisos'"
          class="feed__tab"
          (click)="setActiveTab('avisos')"
        >
          <span class="feed__tab-icon" aria-hidden="true">♢</span>
          Avisos
        </button>

        <button
          type="button"
          role="tab"
          id="tab-encuestas"
          aria-controls="panel-publicaciones"
          [attr.aria-selected]="activeTab() === 'encuestas'"
          [class.feed__tab--active]="activeTab() === 'encuestas'"
          class="feed__tab"
          (click)="setActiveTab('encuestas')"
        >
          <span class="feed__tab-icon" aria-hidden="true">▤</span>
          Encuestas
        </button>
      </nav>

      <!-- PUBLICACIONES SEGÚN LA PESTAÑA -->
      <div
        class="feed__scroll-container"
        id="panel-publicaciones"
        role="tabpanel"
        aria-labelledby="tab-inicio"
      >
        <div class="feed__timeline">
          @for (post of publicacionesFiltradas(); track post.id) {
            <div class="feed__item">
              <span
                class="feed__timeline-dot"
                aria-hidden="true"
              ></span>

              <app-post-card
                [post]="post"
                (reactionRequested)="toggleReaction($event)"
                (commentAdded)="addComment($event)"
              />
            </div>
          } @empty {
            <app-empty-state
              [title]="
                activeTab() === 'avisos'
                  ? 'Todavía no hay avisos'
                  : activeTab() === 'encuestas'
                    ? 'Todavía no hay encuestas'
                    : 'Todavía no hay publicaciones'
              "
              description="Volvé más tarde para consultar las novedades de tu comunidad."
            />
          }
        </div>
      </div>
    </main>
  </div>

  <!-- MODAL DE CREACIÓN -->
  <app-modal
    [open]="isCreatePostOpen()"
    (openChange)="closeCreatePost()"
    heading="Crear publicación"
    size="lg"
  >
    @if (userRole() === 'admin') {
      <app-formulario-publicacion
        (publicada)="closeCreatePost()"
      />
    } @else {
      <app-create-post-form
        [role]="userRole()"
        (postCreated)="createPost($event)"
      />
    }
  </app-modal>

  <!-- MODAL DE HISTORIAL DE ENCUESTAS -->
  <app-modal
    [open]="isPollsOpen()"
    (openChange)="closePolls()"
    heading="Historial de Encuestas"
    size="lg"
  >
    <app-historial-encuestas
      (solicitarCrear)="openCreatePost()"
    />
  </app-modal>
</section>
