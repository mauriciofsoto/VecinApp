
<app-form-layout
  title="Reportar una incidencia"
  description="Informá un problema del edificio o de los espacios comunes para que administración pueda darle seguimiento."
>
  <form
    id="crear-incidencia-form"
    class="incidencia-form"
    (ngSubmit)="publicarIncidencia()"
  >
    <div class="form-field">
      <label for="titulo">Título *</label>

      <app-input
        id="titulo"
        name="titulo"
        type="text"
        placeholder="Ej. Pérdida de agua en el pasillo"
        [ngModel]="titulo()"
        (ngModelChange)="titulo.set($event)"
        [maxlength]="100"
        [required]="true"
      />
    </div>

    <div class="form-field">
      <label for="descripcion">Descripción *</label>

      <app-input
        id="descripcion"
        name="descripcion"
        [multiline]="true"
        placeholder="Describí el problema y cualquier detalle relevante..."
        [ngModel]="descripcion()"
        (ngModelChange)="descripcion.set($event)"
        [maxlength]="1000"
        [rows]="5"
        [required]="true"
      />
    </div>

    <div class="incidencia-form__grid">
      <div class="form-field">
        <label for="categoria">Categoría *</label>

        <app-select
          id="categoria"
          name="categoria"
          [ngModel]="categoria()"
          (ngModelChange)="categoria.set($event)"
          [options]="categorias"
          placeholder="Seleccioná una categoría"
          [required]="true"
        />
      </div>

      <div class="form-field">
        <label for="prioridad">Prioridad</label>

        <app-select
          id="prioridad"
          name="prioridad"
          [ngModel]="prioridad()"
          (ngModelChange)="prioridad.set($event)"
          [options]="prioridades"
        />
      </div>
    </div>

    <div class="form-field">
      <label for="ubicacion">Ubicación *</label>

      <app-input
        id="ubicacion"
        name="ubicacion"
        type="text"
        placeholder="Ej. Piso 3, pasillo"
        [ngModel]="ubicacion()"
        (ngModelChange)="ubicacion.set($event)"
        [maxlength]="150"
        [required]="true"
      />
    </div>

    <section class="incidencia-form__attachments">
      <div class="form-field">
        <label>Evidencia adjunta</label>
        <p class="form-hint">
          Podés agregar fotografías o videos para explicar mejor el problema.
        </p>
      </div>

      <app-media-attachments
        (attachmentsChange)="actualizarAdjuntos($event)"
      />
    </section>

    @if (error()) {
      <p class="form-feedback form-feedback--error" role="alert">
        {{ error() }}
      </p>
    }

    <div class="incidencia-form__actions">
      <app-button
        type="submit"
        variant="primary"
        size="lg"
      >
        Enviar reporte
      </app-button>
    </div>
  </form>
</app-form-layout>
