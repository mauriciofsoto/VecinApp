
<app-modal
  [(open)]="open"
  heading="Confirmar recepción"
  size="sm"
>
  <div class="confirmation-content">
    <div class="confirmation-icon">
      <span aria-hidden="true">📦</span>
    </div>

    <h3>¿Recibiste tu paquete?</h3>

    <p>
      Vas a confirmar que recibiste el siguiente paquete:
    </p>

    <div class="package-summary">
      <strong>{{ paquete().identificacion }}</strong>
      <span>Remitente: {{ paquete().remitente }}</span>
    </div>

    <p class="confirmation-note">
      Solo podés confirmar después de que el personal registre la entrega física.
    </p>
  </div>

  <div modal-footer class="confirmation-actions">
    <button
      type="button"
      class="button-secondary"
      (click)="cancelar()"
    >
      Volver
    </button>

    <button
      type="button"
      class="button-primary"
      [disabled]="disabled()"
      (click)="confirmarRecepcion()"
    >
      {{ disabled() ? 'Confirmando…' : 'Confirmar recepción' }}
    </button>
  </div>
</app-modal>
