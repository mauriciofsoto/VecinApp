<app-auth-layout [showTopLink]="true" topLinkText="Volver al login" topLinkRoute="/login">
  <div class="text-center mb-6">
    <h2 class="text-xl font-bold text-brand-neutral-title">
      Recuperar contraseña
    </h2>
    <p class="text-xs text-brand-neutral-muted mt-2">
      Ingresá el correo asociado a tu cuenta y te enviaremos las instrucciones para restablecerla.
    </p>
  </div>

  @if (isSent) {
    <!-- Aviso de confirmación de envío -->
    <div class="flex flex-col items-center gap-3 text-center py-4">
      <div class="w-12 h-12 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-xl">
        ✉️
      </div>
      <p class="text-sm font-medium text-emerald-800">
        {{ successMessage }}
      </p>
      <p class="text-xs text-brand-neutral-muted max-w-xs">
        Revisá tu bandeja de entrada o la carpeta de correo no deseado.
      </p>
    </div>
  } @else {
    <!-- Formulario -->
    <form (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
      <div class="flex flex-col gap-1.5">
        <label for="recovery-email" class="text-xs font-semibold text-brand-neutral-title ml-1">
          Email
        </label>
        <input 
          id="recovery-email" 
          type="email" 
          name="email"
          [(ngModel)]="email"
          required
          placeholder="Email@gmail.com" 
          class="w-full px-4 py-3 rounded-xl bg-brand-surface-input text-brand-neutral-title placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-brand-purple transition-all" 
        />
      </div>

      @if (errorMessage) {
        <div class="bg-red-50 border border-red-200 text-red-600 px-4 py-2 rounded-xl text-xs text-center font-medium">
          {{ errorMessage }}
        </div>
      }

      <div class="flex justify-center mt-6">
        <button 
          type="submit" 
          [disabled]="isLoading"
          class="px-8 py-2.5 rounded-full bg-brand-purple hover:bg-brand-purple-dark disabled:opacity-50 text-white font-medium text-sm shadow-md hover:shadow-lg transition-all duration-200 cursor-pointer active:scale-95"
        >
          {{ isLoading ? 'Enviando...' : 'Enviar instrucciones' }}
        </button>
      </div>
    </form>
  }
</app-auth-layout>
