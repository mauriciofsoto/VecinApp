<app-auth-layout [showTopLink]="true" topLinkText="Volver al login" topLinkRoute="/login">
  <div class="text-center mb-3">
    <h2 class="text-xl font-bold text-brand-neutral-title">
      Restablecer contraseña
    </h2>
    <p class="text-xs text-brand-neutral-muted mt-1">
      Ingresá el código recibido y definí tu nueva contraseña.
    </p>
  </div>

  <form (ngSubmit)="onSubmit()" class="flex flex-col gap-3">
    <!-- Email -->
    <div class="flex flex-col gap-1.5">
      <label for="email" class="text-xs font-semibold text-brand-neutral-title ml-1">
        Email
      </label>
      <input 
        id="email" 
        type="email" 
        name="email"
        [(ngModel)]="email"
        required
        placeholder="tu@email.com" 
        class="w-full px-4 py-3 rounded-xl bg-brand-surface-input text-brand-neutral-title placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-brand-purple transition-all" 
      />
    </div>

    <!-- Código de Verificación -->
    <div class="flex flex-col gap-1.5">
      <label for="code" class="text-xs font-semibold text-brand-neutral-title ml-1">
        Código de verificación
      </label>
      <input 
        id="code" 
        type="text" 
        name="token"
        [(ngModel)]="token"
        required
        placeholder="Pegá aquí tu token o código" 
        class="w-full px-4 py-3 rounded-xl bg-brand-surface-input text-brand-neutral-title placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-brand-purple transition-all" 
      />
    </div>

    <!-- Nueva Contraseña -->
    <div class="flex flex-col gap-1.5">
      <label for="new-password" class="text-xs font-semibold text-brand-neutral-title ml-1">
        Nueva contraseña
      </label>
      <div class="relative w-full">
        <input 
          id="new-password" 
          [type]="showNewPassword() ? 'text' : 'password'" 
          name="newPassword"
          [(ngModel)]="newPassword"
          required
          placeholder="********" 
          class="w-full pl-4 pr-11 py-3 rounded-xl bg-brand-surface-input text-brand-neutral-title placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-brand-purple transition-all" 
        />
        <button 
          type="button" 
          (click)="toggleShowNewPassword()" 
          class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400 hover:text-brand-purple transition-colors focus:outline-none cursor-pointer"
          [attr.aria-label]="showNewPassword() ? 'Ocultar contraseña' : 'Ver contraseña'"
        >
          @if (showNewPassword()) {
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
            </svg>
          } @else {
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
          }
        </button>
      </div>
    </div>

    <!-- Confirmar Contraseña -->
    <div class="flex flex-col gap-1.5">
      <label for="confirm-password" class="text-xs font-semibold text-brand-neutral-title ml-1">
        Confirmar nueva contraseña
      </label>
      <div class="relative w-full">
        <input 
          id="confirm-password" 
          [type]="showConfirmPassword() ? 'text' : 'password'" 
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          required
          placeholder="********" 
          class="w-full pl-4 pr-11 py-3 rounded-xl bg-brand-surface-input text-brand-neutral-title placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-brand-purple transition-all" 
        />
        <button 
          type="button" 
          (click)="toggleShowConfirmPassword()" 
          class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400 hover:text-brand-purple transition-colors focus:outline-none cursor-pointer"
          [attr.aria-label]="showConfirmPassword() ? 'Ocultar contraseña' : 'Ver contraseña'"
        >
          @if (showConfirmPassword()) {
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
            </svg>
          } @else {
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
          }
        </button>
      </div>
    </div>

    <!-- Botón Submit -->
    <div class="flex justify-center mt-3">
      <button 
        type="submit" 
        [disabled]="isLoading"
        class="px-8 py-2.5 rounded-full bg-brand-purple hover:bg-brand-purple-dark disabled:opacity-50 text-white font-medium text-sm shadow-md hover:shadow-lg transition-all duration-200 cursor-pointer active:scale-95"
      >
        {{ isLoading ? 'Guardando...' : 'Guardar contraseña' }}
      </button>
    </div>

    <!-- Cartel Verde (Éxito) -->
    @if (successMessage()) {
      <div class="w-full flex items-center justify-center gap-2 px-4 py-2 text-xs font-semibold text-emerald-700 bg-emerald-50 rounded-xl border border-emerald-200 transition-all duration-300">
        <svg class="w-4 h-4 text-emerald-600 shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
        </svg>
        <span>{{ successMessage() }}</span>
      </div>
    }

    <!-- Cartel Rojo (Error) -->
    @if (errorMessage()) {
      <div class="w-full flex items-center justify-center gap-2 px-4 py-2 text-xs font-semibold text-red-700 bg-red-50 rounded-xl border border-red-200 transition-all duration-300">
        <svg class="w-4 h-4 text-red-600 shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 7.5h.008v.008H12v-.008z" />
        </svg>
        <span>{{ errorMessage() }}</span>
      </div>
    }
  </form>
</app-auth-layout>
