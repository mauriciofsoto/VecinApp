<app-auth-layout [showTopLink]="true" topLinkText="Volver al login" topLinkRoute="/login">
  <div class="text-center mb-6">
    <h2 class="text-xl font-bold text-brand-neutral-title">
      Restablecer contraseña
    </h2>
    <p class="text-xs text-brand-neutral-muted mt-2">
      Ingresá el código recibido y definí tu nueva contraseña.
    </p>
  </div>

  <form (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
    <!-- Email (si no viene por query param se puede editar) -->
    <div class="flex flex-col gap-1.5">
      <label for="email" class="text-xs font-semibold text-brand-neutral-title ml-1">
        Email
      </label>
      <input 
        id="email" 
        type="email" 
        name="email"
        [(ngModel)]="email"
        required
        placeholder="tu@email.com" 
        class="w-full px-4 py-3 rounded-xl bg-brand-surface-input text-brand-neutral-title placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-brand-purple transition-all" 
      />
    </div>

    <!-- Código de Verificación -->
    <div class="flex flex-col gap-1.5">
      <label for="code" class="text-xs font-semibold text-brand-neutral-title ml-1">
        Código de verificación
      </label>
      <input 
        id="code" 
        type="text" 
        name="token"
        [(ngModel)]="token"
        required
        placeholder="Pegá aquí tu token o código" 
        class="w-full px-4 py-3 rounded-xl bg-brand-surface-input text-brand-neutral-title placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-brand-purple transition-all" 
      />
    </div>

    <!-- Nueva Contraseña -->
    <div class="flex flex-col gap-1.5">
      <label for="new-password" class="text-xs font-semibold text-brand-neutral-title ml-1">
        Nueva contraseña
      </label>
      <input 
        id="new-password" 
        type="password" 
        name="newPassword"
        [(ngModel)]="newPassword"
        required
        placeholder="********" 
        class="w-full px-4 py-3 rounded-xl bg-brand-surface-input text-brand-neutral-title placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-brand-purple transition-all" 
      />
    </div>

    <!-- Confirmar Contraseña -->
    <div class="flex flex-col gap-1.5">
      <label for="confirm-password" class="text-xs font-semibold text-brand-neutral-title ml-1">
        Confirmar nueva contraseña
      </label>
      <input 
        id="confirm-password" 
        type="password" 
        name="confirmPassword"
        [(ngModel)]="confirmPassword"
        required
        placeholder="********" 
        class="w-full px-4 py-3 rounded-xl bg-brand-surface-input text-brand-neutral-title placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-brand-purple transition-all" 
      />
    </div>

    <!-- Mensaje de éxito -->
    @if (successMessage) {
      <div class="bg-emerald-50 border border-emerald-200 text-emerald-700 px-4 py-2 rounded-xl text-xs text-center font-medium">
        {{ successMessage }}
      </div>
    }

    <!-- Mensaje de error -->
    @if (errorMessage) {
      <div class="bg-red-50 border border-red-200 text-red-600 px-4 py-2 rounded-xl text-xs text-center font-medium">
        {{ errorMessage }}
      </div>
    }

    <!-- Botón Submit -->
    <div class="flex justify-center mt-6">
      <button 
        type="submit" 
        [disabled]="isLoading"
        class="px-8 py-2.5 rounded-full bg-brand-purple hover:bg-brand-purple-dark disabled:opacity-50 text-white font-medium text-sm shadow-md hover:shadow-lg transition-all duration-200 cursor-pointer active:scale-95"
      >
        {{ isLoading ? 'Guardando...' : 'Guardar contraseña' }}
      </button>
    </div>
  </form>
</app-auth-layout>
