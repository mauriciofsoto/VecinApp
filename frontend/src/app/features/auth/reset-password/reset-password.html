<app-auth-layout [showTopLink]="true" topLinkText="Volver al login" topLinkRoute="/login">
  <div class="text-center mb-6">
    <h2 class="text-xl font-bold text-brand-neutral-title">
      Restablecer contraseña
    </h2>
    <p class="text-xs text-brand-neutral-muted mt-2">
      Ingresá el código de verificación y tu nueva contraseña.
    </p>
  </div>

  <form class="flex flex-col gap-4">
    <!-- Código de Verificación -->
    <div class="flex flex-col gap-1.5">
      <label for="code" class="text-xs font-semibold text-brand-neutral-title ml-1">
        Código de verificación
      </label>
      <input 
        id="code" 
        type="text" 
        placeholder="123456" 
        class="w-full px-4 py-3 rounded-xl bg-brand-surface-input text-brand-neutral-title placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-brand-purple transition-all" 
      />
    </div>

    <!-- Nueva Contraseña -->
    <div class="flex flex-col gap-1.5">
      <label for="new-password" class="text-xs font-semibold text-brand-neutral-title ml-1">
        Nueva contraseña
      </label>
      <input 
        id="new-password" 
        type="password" 
        placeholder="********" 
        class="w-full px-4 py-3 rounded-xl bg-brand-surface-input text-brand-neutral-title placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-brand-purple transition-all" 
      />
    </div>

    <!-- Confirmar Contraseña -->
    <div class="flex flex-col gap-1.5">
      <label for="confirm-password" class="text-xs font-semibold text-brand-neutral-title ml-1">
        Confirmar contraseña
      </label>
      <input 
        id="confirm-password" 
        type="password" 
        placeholder="********" 
        class="w-full px-4 py-3 rounded-xl bg-brand-surface-input text-brand-neutral-title placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-brand-purple transition-all" 
      />
    </div>

    <!-- Botón Actualizar -->
    <div class="flex justify-center mt-6">
      <button 
        type="submit" 
        class="px-8 py-2.5 rounded-full bg-brand-purple hover:bg-brand-purple-dark text-white font-medium text-sm shadow-md hover:shadow-lg transition-all duration-200 cursor-pointer active:scale-95"
      >
        Guardar contraseña
      </button>
    </div>
  </form>
</app-auth-layout>
