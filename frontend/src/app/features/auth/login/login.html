
<main class="login-page">
  <section class="" aria-labelledby="page-login">
   <span class="login-brand">VecinApp</span>

    <section class="login-card" aria-labelledby="login-title">
      <header class="login-header">
        <h1 id="login-title">¡Hola de nuevo!</h1>
        <p>Ingresá a tu cuenta para continuar.</p>
      </header>

      <form class="login-form" (ngSubmit)="onSubmit()">
        <div class="form-field">
          <label for="email">Correo electrónico</label>
          <input
            id="email"
            name="email"
            type="email"
            [(ngModel)]="email"
            placeholder="nombre@correo.com"
            autocomplete="username"
            required
            [disabled]="loading()"
          />
        </div>

        <div class="form-field">
          <label for="password">Contraseña</label>
          <input
            id="password"
            name="password"
            type="password"
            [(ngModel)]="password"
            placeholder="********"
            autocomplete="current-password"
            required
            [disabled]="loading()"
          />
        </div>

        <div class="login-links">
          <a routerLink="/forgot-password">¿Olvidaste tu contraseña?</a>
          <app-button routerLink="/registro">Crear mi cuenta</app-button>
        </div>

        @if (errorMessage()) {
          <p class="login-error" role="alert">
            {{ errorMessage() }}
          </p>
        }

        <button type="submit" [disabled]="loading()">
          {{ loading() ? 'Ingresando...' : 'Iniciar sesión' }}
        </button>
      </form>
    </section>
  </section>
</main>
